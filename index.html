<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>開票カウンター</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#f3f1ea;
    --paper-dim:#e7e3d8;
    --line:#c9c3b3;
    --shinnin:#1f6f5c;
    --shinnin-dim:#e4efe9;
    --fushinnin:#a8432f;
    --fushinnin-dim:#f3e6e0;
    --muko:#8a6d1f;
    --muko-dim:#f0ead8;
    --neutral:#3a4250;
    --neutral-dim:#e6e5e0;
    --warn:#b5432f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  body{
    display:flex; flex-direction:column;
    height:100dvh; width:100vw;
    color:var(--ink);
  }

  /* Header */
  header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:var(--ink);
    color:var(--paper);
  }
  header h1{
    font-size:15px; font-weight:600; margin:0;
    letter-spacing:0.05em;
  }
  header .sub{
    font-size:10px; color:#8b95a5; margin-top:2px; letter-spacing:0.05em;
  }
  #resetBtn{
    background:transparent; border:1px solid #4a5462; color:#c7cdd6;
    font-size:12px; padding:7px 12px; border-radius:6px;
    font-family:inherit; letter-spacing:0.05em;
  }
  #resetBtn:active{ background:#2a323f; }

  /* Balance check strip */
  #balance{
    flex:0 0 auto;
    text-align:center;
    font-size:12px;
    padding:7px 8px;
    letter-spacing:0.04em;
    background:var(--paper-dim);
    color:#6b6455;
    border-bottom:1px solid var(--line);
    transition:background .15s, color .15s;
  }
  #balance.mismatch{
    background:#f4e2dc;
    color:var(--warn);
    font-weight:600;
  }
  #balance.ok{
    background:#e4efe9;
    color:var(--shinnin);
    font-weight:600;
  }

  /* Main row of 3 counters */
  main{
    flex:1 1 auto;
    display:flex;
    background:var(--paper);
    min-height:0;
  }
  .col{
    flex:1;
    display:flex; flex-direction:column;
    min-width:0;
    border-right:1px solid var(--line);
  }
  .col:last-child{ border-right:none; }

  .tapzone{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:8px 4px;
    -webkit-user-select:none;
    touch-action:manipulation;
    transition:background .08s;
    position:relative;
  }
  .tapzone:active{ background:rgba(0,0,0,0.05); }

  .label{
    font-size:clamp(10px,3vw,15px);
    font-weight:700;
    letter-spacing:0.06em;
    margin-bottom:2px;
    text-align:center;
  }
  .col.count .label{ color:var(--neutral); }
  .col.shinnin .label{ color:var(--shinnin); }
  .col.fushinnin .label{ color:var(--fushinnin); }
  .col.muko .label{ color:var(--muko); }

  .number{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
    font-family:"SF Mono","Roboto Mono",monospace;
    font-weight:700;
    line-height:1;
    font-size:clamp(26px,10vw,56px);
    margin:4px 0 6px 0;
  }
  .col.count .number{ color:var(--neutral); }
  .col.shinnin .number{ color:var(--shinnin); }
  .col.fushinnin .number{ color:var(--fushinnin); }
  .col.muko .number{ color:var(--muko); }

  .hint{
    font-size:10px;
    color:#9a9484;
    letter-spacing:0.04em;
    margin-top:2px;
  }

  /* tally (正) marks */
  .tally{
    display:flex; flex-wrap:wrap; gap:5px;
    justify-content:center;
    max-width:100%;
    padding:0 6px;
    min-height:18px;
  }
  .tally svg{ width:16px; height:20px; display:block; }
  .tally .partial-wrap{ width:16px; height:20px; }

  /* minus button */
  .minus{
    flex:0 0 auto;
    width:48px; height:30px;
    margin:6px auto 10px auto;
    border-radius:15px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.03);
    font-size:13px;
    font-weight:600;
    color:#7a7466;
    font-family:inherit;
  }
  .minus:active{ background:rgba(0,0,0,0.08); }

  footer{
    flex:0 0 auto;
    text-align:center;
    font-size:10px;
    color:#8b95a5;
    padding:6px 8px 10px 8px;
    background:var(--ink);
    letter-spacing:0.04em;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,30,0.55);
    display:none; align-items:center; justify-content:center;
    z-index:10; padding:24px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--paper); border-radius:10px;
    padding:20px; max-width:300px; width:100%;
    text-align:center;
  }
  .modal p{ font-size:14px; color:var(--ink); margin:0 0 16px 0; line-height:1.6; }
  .modal .row{ display:flex; gap:8px; }
  .modal button{
    flex:1; padding:10px; border-radius:6px; border:none;
    font-size:13px; font-weight:600; font-family:inherit;
  }
  .modal .cancel{ background:var(--neutral-dim); color:var(--neutral); }
  .modal .confirm{ background:var(--warn); color:#fff; }
</style>
</head>
<body>

<header>
  <div>
    <h1>開票カウンター</h1>
    <div class="sub">タップで加算 / 下のボタンで1減算</div>
  </div>
  <button id="resetBtn">リセット</button>
</header>

<div id="balance">投票数と信任+不信任+無効が一致しています</div>

<main>
  <div class="col count">
    <div class="tapzone" id="tap-count">
      <div class="label">投票数</div>
      <div class="number" id="num-count">0</div>
      <div class="tally" id="tally-count"></div>
      <div class="hint">総投票数</div>
    </div>
    <button class="minus" data-target="count">－1</button>
  </div>

  <div class="col shinnin">
    <div class="tapzone" id="tap-shinnin">
      <div class="label">信任</div>
      <div class="number" id="num-shinnin">0</div>
      <div class="tally" id="tally-shinnin"></div>
      <div class="hint">賛成票</div>
    </div>
    <button class="minus" data-target="shinnin">－1</button>
  </div>

  <div class="col fushinnin">
    <div class="tapzone" id="tap-fushinnin">
      <div class="label">不信任</div>
      <div class="number" id="num-fushinnin">0</div>
      <div class="tally" id="tally-fushinnin"></div>
      <div class="hint">反対票</div>
    </div>
    <button class="minus" data-target="fushinnin">－1</button>
  </div>

  <div class="col muko">
    <div class="tapzone" id="tap-muko">
      <div class="label">無効</div>
      <div class="number" id="num-muko">0</div>
      <div class="tally" id="tally-muko"></div>
      <div class="hint">無効票</div>
    </div>
    <button class="minus" data-target="muko">－1</button>
  </div>
</main>

<footer>カウントはこの端末・このブラウザに自動保存されます</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <p>すべてのカウントを 0 に戻します。<br>保存されているデータも削除されます。<br>よろしいですか？</p>
    <div class="row">
      <button class="cancel" id="cancelReset">キャンセル</button>
      <button class="confirm" id="confirmReset">リセットする</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'kaihyo-counter-state-v1';

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(typeof parsed.count === 'number' && typeof parsed.shinnin === 'number' && typeof parsed.fushinnin === 'number'){
          return {
            count: parsed.count,
            shinnin: parsed.shinnin,
            fushinnin: parsed.fushinnin,
            muko: typeof parsed.muko === 'number' ? parsed.muko : 0
          };
        }
      }
    }catch(e){
      // localStorage が使えない環境（プライベートモード等）ではメモリ上のみで動作
    }
    return { count: 0, shinnin: 0, fushinnin: 0, muko: 0 };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // 保存できなくてもアプリ自体は動作を続ける
    }
  }

  var state = loadState();

  // Stroke paths for a simplified "正" tally glyph, drawn in the
  // traditional 5-stroke order used for hand tallying in Japan.
  var STROKES = [
    "M3 4 H13",        // 1: top horizontal
    "M6 4 V17",         // 2: left vertical
    "M3 10 H13",       // 3: middle horizontal
    "M10 4 V17",        // 4: right vertical
    "M2 17 H14"        // 5: bottom horizontal (longest)
  ];

  function buildStrokeSVG(activeCount){
    // activeCount: 0-5, how many strokes to show
    var svg = '<svg viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">';
    for(var i=0;i<5;i++){
      var on = i < activeCount;
      svg += '<path d="'+STROKES[i]+'" opacity="'+(on?1:0)+'"/>';
    }
    svg += '</svg>';
    return svg;
  }

  function renderTally(key){
    var el = document.getElementById('tally-'+key);
    var n = state[key];
    var fullGroups = Math.floor(n/5);
    var remainder = n%5;
    var html = '';
    var shown = Math.min(fullGroups, 6); // cap visible full glyphs to avoid overflow
    for(var g=0; g<shown; g++){
      html += buildStrokeSVG(5);
    }
    if(fullGroups > shown){
      el.innerHTML = html + '<span style="font-size:11px;color:inherit;align-self:center;">+'+(fullGroups-shown)+'</span>' + (remainder>0? buildStrokeSVG(remainder): '');
      return;
    }
    if(remainder>0){
      html += buildStrokeSVG(remainder);
    }
    el.innerHTML = html;
  }

  function renderNumber(key){
    document.getElementById('num-'+key).textContent = state[key];
  }

  function renderBalance(){
    var el = document.getElementById('balance');
    var sum = state.shinnin + state.fushinnin + state.muko;
    if(state.count === 0 && sum === 0){
      el.className = '';
      el.textContent = '投票数と信任+不信任+無効が一致しています';
      return;
    }
    if(sum === state.count){
      el.className = 'ok';
      el.textContent = '一致 OK：投票数 '+state.count+' ＝ 信任 '+state.shinnin+' ＋ 不信任 '+state.fushinnin+' ＋ 無効 '+state.muko;
    } else {
      var diff = state.count - sum;
      el.className = 'mismatch';
      el.textContent = '不一致：投票数と合計の差 '+ (diff>0? diff : Math.abs(diff)) +' 票（投票数 '+state.count+' / 合計 '+sum+'）';
    }
  }

  function renderAll(){
    ['count','shinnin','fushinnin','muko'].forEach(function(key){
      renderNumber(key);
      renderTally(key);
    });
    renderBalance();
  }

  function inc(key){
    state[key] = state[key] + 1;
    renderAll();
    saveState();
  }
  function dec(key){
    state[key] = Math.max(0, state[key] - 1);
    renderAll();
    saveState();
  }

  document.getElementById('tap-count').addEventListener('click', function(){ inc('count'); });
  document.getElementById('tap-shinnin').addEventListener('click', function(){ inc('shinnin'); });
  document.getElementById('tap-fushinnin').addEventListener('click', function(){ inc('fushinnin'); });
  document.getElementById('tap-muko').addEventListener('click', function(){ inc('muko'); });

  var minusButtons = document.querySelectorAll('.minus');
  minusButtons.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      dec(btn.getAttribute('data-target'));
    });
  });

  // Reset flow with custom confirm modal (no window.confirm dependency)
  var overlay = document.getElementById('overlay');
  document.getElementById('resetBtn').addEventListener('click', function(){
    overlay.classList.add('show');
  });
  document.getElementById('cancelReset').addEventListener('click', function(){
    overlay.classList.remove('show');
  });
  document.getElementById('confirmReset').addEventListener('click', function(){
    state = { count:0, shinnin:0, fushinnin:0, muko:0 };
    renderAll();
    saveState();
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', function(e){
    if(e.target === overlay){ overlay.classList.remove('show'); }
  });

  renderAll();
})();
</script>

</body>
</html>
